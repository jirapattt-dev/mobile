name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --no-codesign --release \
            --dart-define=LICHESS_HOST=lichess.org \
            --dart-define=LICHESS_WS_HOST=socket.lichess.org \
            --dart-define=LICHESS_CDN_HOST=https://lichess.org \
            --dart-define=LICHESS_OPENING_EXPLORER_HOST=explorer.lichess.org \
            --dart-define=LICHESS_TABLEBASE_HOST=tablebase.lichess.org

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r LichessAssistant.ipa Payload
          ls -lh LichessAssistant.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichessAssistant-unsigned-ipa
          path: LichessAssistant.ipa
          retention-days: 7
